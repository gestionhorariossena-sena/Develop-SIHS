name: sihs_mobile
description: "SIHS Mobile - Versión móvil del Sistema de Información SIHS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Autenticación y BD
  supabase_flutter: ^2.7.0

  # HTTP Client
  dio: ^5.6.0

  # State Management
  provider: ^6.1.5

  # Preferencia local del "Mantener sesión iniciada" del login
  shared_preferences: ^2.5.3

  # Configuración
  flutter_dotenv: ^5.1.0

  # UI
  intl: ^0.20.0
  google_fonts: ^8.2.1  # 8.x es la primera que trae Geist (la fuente de cuerpo del brand guide)

  # Skeletons de carga (HomeScreen). Se quitaron flutter_spinkit y lottie:
  # no se usan — el loading es CircularProgressIndicator de Material 3 y no
  # hay animaciones Lottie en assets/.
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/images/
