name: sihs_mobile
description: "SIHS Mobile - Versión móvil del Sistema de Información SIHS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Autenticación y BD
  supabase_flutter: ^2.7.0

  # HTTP Client
  dio: ^5.6.0

  # State Management
  provider: ^6.4.0

  # Configuración
  flutter_dotenv: ^5.1.0

  # UI
  intl: ^0.20.0
  google_fonts: ^6.2.1

  # Animaciones y loading
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/images/
