<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mobile</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Flutter tarda en arrancar y hasta entonces el <body>
  <div id="splash">
    <div class="logo">📅</div>
    <div class="marca">SIHS</div>
    <div class="pie">Sistema de Horarios</div>
    <div class="barra"><i></i></div>
  </div> está vacío:
       pantalla en blanco que se lee como "no cargó". Este bloque se pinta
       con el HTML, antes de bajar main.dart.js, y flutter_bootstrap lo
       borra en cuanto el primer frame está listo. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #faf8ff; font-family: system-ui, sans-serif; color: #131b2e;
    }
    #splash .logo {
      width: 64px; height: 64px; border-radius: 16px; background: #006b2c;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
    }
    #splash .marca { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    #splash .pie { font-size: 14px; color: #3e4a3d; }
    #splash .barra {
      width: 160px; height: 3px; border-radius: 99px; overflow: hidden;
      background: #dae2fd;
    }
    #splash .barra i {
      display: block; width: 40%; height: 100%; background: #006b2c;
      animation: corre 1.1s ease-in-out infinite;
    }
    @keyframes corre {
      0% { transform: translateX(-100%); } 100% { transform: translateX(350%); }
    }
    @media (prefers-color-scheme: dark) {
      #splash { background: #faf8ff; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">📅</div>
    <div class="marca">SIHS</div>
    <div class="pie">Sistema de Horarios</div>
    <div class="barra"><i></i></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // El primer frame de Flutter ya está en pantalla: fuera el splash.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
