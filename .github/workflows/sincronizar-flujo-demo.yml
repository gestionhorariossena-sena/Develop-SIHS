name: Sincronizar flujo demo

on:
  issues:
    types: [closed, reopened]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  actualizar-estados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular tareas disponibles
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const dependencies = JSON.parse(
              fs.readFileSync('.github/sihs-demo-dependencies.json', 'utf8'),
            )
            const { owner, repo } = context.repo
            const managedPrefixes = /^(🚀 READY|⛔ BLOQUEADA|🚀 INICIAR AHORA|🔒 BLOQUEADA)\s+/
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            })
            const byNumber = new Map(issues.filter(issue => !issue.pull_request).map(issue => [issue.number, issue]))

            for (const [numberText, required] of Object.entries(dependencies)) {
              const number = Number(numberText)
              const issue = byNumber.get(number)
              if (!issue || issue.state === 'closed') continue

              const ready = required.every(dependency => byNumber.get(dependency)?.state === 'closed')
              const baseTitle = issue.title.replace(managedPrefixes, '')
              const title = `${ready ? '🚀 READY' : '⛔ BLOQUEADA'} ${baseTitle}`

              if (title !== issue.title) {
                await github.rest.issues.update({ owner, repo, issue_number: number, title })
              }
            }
