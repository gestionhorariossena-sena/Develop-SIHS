name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      # Typecheck de la suite Login: evita mocks obsoletos frente a EstadoLogin.
      - run: pnpm exec tsc -p tsconfig.login-tests.json --noEmit

      - run: pnpm test:coverage

  mobile:
    name: Mobile (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: cp .env.example .env

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  e2e-smoke:
    name: E2E (login sin credenciales)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm install --dir ../frontend --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec playwright test tests/login.spec.ts --grep "muestra los campos del formulario"

      - run: pnpm exec playwright test tests/login-validacion.spec.ts

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: pytest -v --cov=app --cov-report=term --cov-fail-under=84

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [frontend, backend, mobile, e2e-smoke]
    steps:
      - run: echo "Backend, frontend, mobile y E2E aplicable aprobaron sus validaciones."
